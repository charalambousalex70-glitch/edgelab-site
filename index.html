      <p>The bar under each match shows the model's chances; the thin black marks show the exchange's. Fair odds are 1 divided by the chance: bet only when a bookmaker offers more.</p>`)}
    ${valueHtml}
    <div class="legend"><span><i style="background:var(--home)"></i>Home win</span><span><i style="background:var(--draw)"></i>Draw</span><span><i style="background:var(--away)"></i>Away win</span>${anySharp ? `<span><span class="tick-key"></span>Betting exchange's split</span>` : anyMarket ? `<span><span class="tick-key"></span>Bookmakers' split</span>` : ""}</div>`;
  let day = "";
  fx.forEach((f, idx) => {

      <div><div class="diff" style="margin-bottom:.35rem">Most likely scores</div><div class="scores">${f.scores.map(([i, j, q]) => `<span>${i}-${j} ${pc(q)}</span>`).join("")}</div></div>
      ${gridBlock(f, idx)}

  if (!anyMarket) html += `<p class="diff" style="margin-top:1rem">${anyLive
    ? `Bookmaker prices here are live from The Odds API, last checked ${esc(utcTime((DATA.moves || {}).last))} (UK time). Bet365 is not in that feed; its price and the market average are added from Football-Data on Friday afternoon (Tuesday for midweek rounds).`
    : "No bookmaker has priced this round yet. Prices appear here as soon as the odds feed lists them, usually a week or more before kick-off."}</p>`;
  return html;
}

let boardWin = "season";
function fmtVs(r) {
  if (r.reference) return `<span class="same">reference</span>`;

  const ci = r.vs_ref_ci, clear = ci != null && Math.abs(r.vs_ref) > ci;
  const cls = !clear ? "same" : r.vs_ref < 0 ? "better" : "worse";
  const v = Math.abs(r.vs_ref) < 0.0005 ? "0.000" : (r.vs_ref > 0 ? "+" : "") + r.vs_ref.toFixed(3);
  return `<span class="${cls}">${v}</span>${ci != null ? `<small>±${ci.toFixed(3)}</small>` : ""}`;
}
function boardTable(rows, withBest = true) {
  const sorted = [...rows].sort((a, b) => (b.payout ?? -1) - (a.payout ?? -1));

    ${sorted.map((r) => `<tr class="${r.reference ? "ref" : r.model ? "mine2 mine" : ""}"><td>${esc(r.name)}<small>${r.n} matches${r.exchange ? ", exchange" : r.model ? ", our model" : ""}</small></td>
      <td>${r.payout != null ? pc(r.payout, 1) : "–"}</td>${withBest ? `<td>${r.best_share != null ? pc(r.best_share) : "–"}</td>` : ""}<td>${fmtVs(r)}</td></tr>`).join("")}</tbody></table></div>`;
}

    ${boardTable(w.rows)}

    <h3 class="day">Live tracker</h3>

      : `<p class="diff">${DATA.odds_api ? "Live prices are being saved before each match; this table fills in once those matches are played." : "Switches on when The Odds API key is added. It covers Pinnacle, Betfair Sportsbook, William Hill, Paddy Power, Sky Bet, Ladbrokes, Coral, Betfred, BetVictor, Betway, Unibet and more, each saved at the same moment before kick-off and scored after the result."}</p>`}`;

// ---------------------------------------------------------------- shared helpers
const sgn = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);
const pcs = (x, d = 1) => (x == null ? "–" : sgn(x * 100, d) + "%");
const units = (x) => (x == null ? "–" : sgn(x, 2) + " u");
function explain(title, body, open = false) {
  return `<details class="explain"${open ? " open" : ""}><summary>${title}</summary><div>${body}</div></details>`;
}
function rangeText(x, ci) { return ci == null ? "" : `range ${pcs(x - ci)} to ${pcs(x + ci)}`; }

// Line chart: series = [{name, color, dash, points: [[label, x, y], ...]}], y in betting units.
const CHARTS = {};
let chartSeq = 0;
function lineChart(series, opt = {}) {
  series = series.filter((s) => s.points && s.points.length > 1);
  if (!series.length) return "";
  const id = "c" + ++chartSeq;
  const W = 360, H = 210, L = 44, R = 64, T = 10, B = 26;
  const xs = series.flatMap((s) => s.points.map((p) => p[1])), ys = series.flatMap((s) => s.points.map((p) => p[2]));
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const fmt = opt.fmt || units;
  let y0 = opt.zero === false ? Math.min(...ys) : Math.min(0, ...ys), y1 = opt.zero === false ? Math.max(...ys) : Math.max(0, ...ys);
  const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  const X = (v) => L + ((v - x0) / Math.max(1, x1 - x0)) * (W - L - R);
  const Y = (v) => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);
  const step = niceStep((y1 - y0) / 4);
  const ticks = []; for (let v = Math.ceil(y0 / step) * step; v <= y1; v += step) ticks.push(+v.toFixed(6));
  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="${v === 0 ? "zero" : ""}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? "0" : opt.plain ? v.toFixed(step < 1 ? 1 : 0) : sgn(v, step < 1 ? 1 : 0)}</text>`).join("");
  const first = series[0].points[0], last = series[0].points[series[0].points.length - 1];
  const long = (parseLocal(last[0]) - parseLocal(first[0])) > 120 * 864e5;
  const xfmt = (d) => long ? parseLocal(d).toLocaleDateString("en-GB", { month: "short", year: "numeric" }) : shortDay(d);
  const xl = `<text x="${L}" y="${H - 6}">${esc(xfmt(first[0]))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(xfmt(last[0]))}</text>`;
  // direct labels at the line ends, nudged apart
  const ends = series.map((s) => ({ s, y: Y(s.points[s.points.length - 1][2]) })).sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 14) ends[i].y = ends[i - 1].y + 14;
  const lines = series.map((s) => `<polyline fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round" points="${s.points.map((p) => `${X(p[1]).toFixed(1)},${Y(p[2]).toFixed(1)}`).join(" ")}"/>`).join("");
  const labels = ends.map((e) => `<text class="lbl" x="${W - R + 6}" y="${e.y + 4}">${esc(fmt(e.s.points[e.s.points.length - 1][2]))}</text>`).join("");
  CHARTS[id] = { series, X, Y, W, H, L, R, T, B, x0, x1, fmt };
  const key = series.length > 1 ? `<div class="ckey">${series.map((s) => `<span><i class="${s.dash ? "dash" : ""}" style="background:${s.color};border-color:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `${key}<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(opt.label || "Cumulative profit")}. ${series.map((s) => `${s.name}: ${fmt(s.points[s.points.length - 1][2])}`).join("; ")}">
    <g class="grid">${grid}</g>${xl}${lines}${labels}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}"/>
    <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" aria-hidden="true"></div></div>`;
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw || 1))); const f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }
function wireCharts() {
  document.querySelectorAll("[data-chart]").forEach((el) => {
    const c = CHARTS[el.dataset.chart]; if (!c) return;
    const svg = el.querySelector("svg"), xh = el.querySelector(".xh"), tip = el.querySelector(".tip");
    const base = c.series[0].points;
    let cur = base.length - 1;
    function show(i) {
      cur = Math.max(0, Math.min(base.length - 1, i));
      const xv = base[cur][1], px = c.X(xv);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.visibility = "visible";
      tip.textContent = "";
      const h = document.createElement("div"); h.className = "h"; h.textContent = `${parseLocal(base[cur][0]).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })} · bet ${xv}`; tip.appendChild(h);
      c.series.forEach((s) => {
        let p = s.points[0]; for (const q of s.points) { if (q[1] <= xv) p = q; else break; }
        const r = document.createElement("div"); r.className = "r";
        const k = document.createElement("i"); k.style.background = s.color;
        const v = document.createElement("b"); v.textContent = c.fmt(p[2]);
        const n = document.createElement("span"); n.textContent = s.name;
        r.append(k, v, n); tip.appendChild(r);
      });
      const box = el.getBoundingClientRect(), scale = box.width / c.W;
      tip.style.visibility = "visible";
      const left = px * scale + 12, w = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(box.width - w, left + w > box.width ? px * scale - w - 12 : left)) + "px";
    }
    function hide() { xh.style.visibility = "hidden"; tip.style.visibility = "hidden"; }
    function nearest(ev) {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const v = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = 0, bd = 1e9; base.forEach((p, i) => { const d = Math.abs(c.X(p[1]) - v.x); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    svg.addEventListener("pointermove", (ev) => show(nearest(ev)));
    svg.addEventListener("pointerdown", (ev) => show(nearest(ev)));
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => show(cur));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") { show(cur + 1); ev.preventDefault(); }
      if (ev.key === "ArrowLeft") { show(cur - 1); ev.preventDefault(); }
    });
  });
}

function recValue() {
  const v = DATA.value, bt = DATA.backtest;
  const steps = `<div class="steps3">
      <div><b>Fair price</b> from the Betfair Exchange and Pinnacle, margin removed.</div>
      <div><b>Value</b> when a bookmaker pays ${(DATA.value_threshold * 100).toFixed(0)}%+ more. Logged before kick-off.</div>
      <div><b>Checked</b> against the result and the exchange's closing price.</div></div>`;
  const how = explain("Why the closing price matters more than profit", `<p>Football is noisy: a good bet loses often and a bad one wins often, so profit over a few dozen bets is mostly luck. The <strong>closing price</strong> (the exchange's odds at kick-off) is the market's best estimate once all news is in. If our bets keep getting better odds than that, we are taking prices that are too generous, and that edge turns into profit over hundreds of bets.</p>
    <p><strong>Beat the closing price by +3%</strong> means: on average, the odds we took were 3% higher than fair odds at kick-off. The dashed line in the chart is the profit that edge should have produced; the solid line is what actually happened.</p>`);
  if (!v || !v.logged) return steps + `<p class="empty">No value bets logged yet.</p>`;
  if (!v.settled) return steps + how + `<p class="diff">${v.logged} value bets logged; none settled yet.</p>`;
  const real = v.clv_lo != null && v.clv_lo > 0;
  const verdict = `<p class="verdict ${real ? "good" : ""}">${real
      ? `<strong>The edge is holding up.</strong> Across ${v.settled} settled value bets, the prices beat the closing price by ${pcs(v.clv)} on average (${rangeText(v.clv, (v.clv_hi - v.clv_lo) / 2)}). Profit so far is ${units(v.profit)}; luck can move that either way, the closing-price edge is the part that should last.`
      : `<strong>Too early to call.</strong> ${v.settled} value bets settled; they beat the closing price by ${pcs(v.clv)} on average${v.clv_lo != null ? ` (${rangeText(v.clv, (v.clv_hi - v.clv_lo) / 2)})` : ""}. The range still includes zero.`}</p>`;
  const tiles = `<dl class="stats">
      <div><dt>Settled bets</dt><dd>${v.settled} <small>${v.wins} won, ${v.logged - v.settled} pending</small></dd></div>
      <div><dt>Profit, 1 unit each</dt><dd class="${v.profit >= 0 ? "ok" : "miss"}">${units(v.profit)} <small>return ${pcs(v.roi)}</small></dd></div>
      <div><dt>Beat closing price</dt><dd>${pcs(v.clv)} <small>${v.clv_lo != null ? `${pcs(v.clv_lo)} to ${pcs(v.clv_hi)}` : "needs 2+ bets"}</small></dd></div></dl>`;
  const chart = v.curve ? `<h3 class="day">Profit, bet by bet</h3>${lineChart([
      { name: "Actual profit", color: "var(--s1)", points: v.curve.map((p) => [p[0], p[1], p[2]]) },
      { name: "Expected from beating the close", color: "var(--s2)", dash: true, points: v.curve.map((p) => [p[0], p[1], p[3]]) }],
      { label: "Value bets, cumulative profit in units" })}` : "";
  const bookRows = (v.by_book || []).map((r) => `<tr><td>${esc(r.book)}</td><td>${r.bets}</td><td>${r.wins}</td><td class="${r.profit >= 0 ? "better" : "worse"}">${units(r.profit)}</td><td>${pcs(r.clv)}</td></tr>`).join("");
  const outRows = (v.by_outcome || []).map((r) => `<tr><td>${OUT[r.outcome]}</td><td>${r.bets}</td><td>${r.wins}</td><td class="${r.profit >= 0 ? "better" : "worse"}">${units(r.profit)}</td><td>${pcs(r.clv)}</td></tr>`).join("");
  const head = (first) => `<thead><tr><th>${first}</th><th>Bets</th><th>Won</th><th>Profit</th><th>Beat close</th></tr></thead>`;
  return `${steps}${verdict}${tiles}${how}${chart}
    ${bookRows ? `<h3 class="day">By bookmaker</h3><div class="cs-scroll"><table class="cmp">${head("Bookmaker")}<tbody>${bookRows}</tbody></table></div>
      <p class="diff cs-note">UK sportsbooks only. Each bet counts once, under the first bookmaker that offered the price. Bets found earlier at non-UK bookmakers are no longer counted.</p>` : ""}
    ${outRows ? `<h3 class="day">By result type</h3><div class="cs-scroll"><table class="cmp">${head("Bet on")}<tbody>${outRows}</tbody></table></div>` : ""}
    ${recLines(v.lines)}
    ${bt ? "" : `<p class="diff cs-note">Tested before going live on 810 past matches (2024 to 2026): 120 value bets beat the closing price by +4.8% (range +3.1% to +6.5%), in every season.</p>`}
    <details class="more-list"><summary>All ${v.logged} value bets</summary><div class="vlist">${v.bets.map((b) => `<div class="vrow"><span>${esc(b.outcome === "draw" ? "Draw" : (b.outcome === "home" ? b.home : b.away) + " to win")} <span class="diff">(${esc(b.home)} v ${esc(b.away)})</span>${b.mine ? `<span class="mine-badge">Yours</span>` : ""}</span>
      <span class="ev ${b.settled ? (b.won ? "ok" : "miss") : ""}" style="${b.settled ? "" : "color:var(--faint)"}">${b.settled ? (b.won ? "Won" : "Lost") : "Pending"}</span>
      <span class="meta num">${esc(shortDay(b.date))}. ${b.price.toFixed(2)} with ${esc(b.books)}, +${(b.ev * 100).toFixed(1)}% at the time${b.clv != null ? `; ${b.clv >= 0 ? "beat" : "missed"} the closing price by ${Math.abs(b.clv * 100).toFixed(1)}%` : ""}.</span></div>`).join("")}</div></details>`;
}

function recLines(L) {
  if (!L) return "";
  const head = `<h3 class="day">Goals value bets (live)</h3>`;
  if (!L.logged) return head + `<p class="diff">Over/under and both-teams-to-score prices are now checked with the same rule. Value bets in these markets are logged and settled here; none has qualified yet.</p>`;
  const stats = L.settled ? `<dl class="stats">
      <div><dt>Settled bets</dt><dd>${L.settled} <small>${L.wins} won, ${L.logged - L.settled} pending</small></dd></div>
      <div><dt>Profit, 1 unit each</dt><dd class="${L.profit >= 0 ? "ok" : "miss"}">${units(L.profit)} <small>return ${pcs(L.roi)}</small></dd></div>
      <div><dt>Beat closing price</dt><dd>${L.clv != null ? pcs(L.clv) : "–"} <small>${L.clv_ci != null ? `±${(L.clv_ci * 100).toFixed(1)}%, ${L.clv_n} bets` : L.clv_n ? `${L.clv_n} bets` : "same-line closes only"}</small></dd></div></dl>` : `<p class="diff">${L.logged} logged; none settled yet.</p>`;
  return `${head}${stats}<details class="more-list"><summary>All ${L.logged} goals bets</summary><div class="vlist">${L.bets.map((b) => `<div class="vrow"><span>${esc(b.label)} <span class="diff">(${esc(b.home)} v ${esc(b.away)})</span></span>
      <span class="ev ${b.settled ? (b.pl > 0 ? "ok" : b.pl < 0 ? "miss" : "") : ""}" style="${b.settled ? "" : "color:var(--faint)"}">${b.settled ? units(b.pl) : "Pending"}</span>
      <span class="meta num">${esc(shortDay(b.date))}. ${b.price.toFixed(2)} with ${esc(b.books)}, +${(b.ev * 100).toFixed(1)}% at the time${b.clv != null ? `; ${b.clv >= 0 ? "beat" : "missed"} the closing price by ${Math.abs(b.clv * 100).toFixed(1)}%` : ""}.</span></div>`).join("")}</div></details>`;
}
function recModel() {
  const r = DATA.record, live = DATA.live, list = r.model_windows || [];
  if (!list.length) return `<p class="empty">No matches to score yet.</p>`;
  const [w, seg] = winSeg(list);
  const me = w.rows[0], avg = w.rows.find((x) => x.label === "Market average") || w.rows[1];
  let verdict = "";
  if (avg && avg.diff != null) {
    const sure = avg.diff_ci != null && Math.abs(avg.diff) > avg.diff_ci;
    verdict = avg.diff > 0
      ? `<strong>The bookmakers have been more accurate${sure ? "" : ", but only slightly"}.</strong> On these ${avg.n} matches their margin-free chances scored ${avg.logloss.toFixed(3)} against the model's ${avg.model_same.toFixed(3)} (lower is better). ${sure ? "The gap is bigger than luck would explain." : "The gap is small enough to be luck."}`
      : `<strong>The model has been ${sure ? "more accurate" : "level with the bookmakers"}.</strong> It scored ${avg.model_same.toFixed(3)} against the bookmakers' ${avg.logloss.toFixed(3)} on ${avg.n} matches (lower is better). ${sure ? "That is more than luck would explain." : "The gap is small enough to be luck."}`;
    verdict += ` The model's favourite won ${pc(avg.model_fav)} of the time, the bookmakers' ${pc(avg.fav)}.`;
  }
  const rows = w.rows.map((x) => `<tr class="${x.model ? "mine" : ""}"><td>${esc(x.label)}<small>${x.n} matches</small></td><td>${x.logloss.toFixed(3)}</td>
      <td>${x.model ? "–" : x.model_same.toFixed(3)}</td><td>${x.model ? "–" : `<span class="${x.diff_ci != null && Math.abs(x.diff) > x.diff_ci ? (x.diff > 0 ? "worse" : "better") : "same"}">${sgn(x.diff, 3)}</span>${x.diff_ci != null ? `<small>±${x.diff_ci.toFixed(3)}</small>` : ""}`}</td><td>${pc(x.fav)}</td></tr>`).join("");
  return `<p class="lede" style="margin-top:-.25rem">Who forecasts results better: our model, or the bookmakers' prices once their margin is removed? Every match was predicted using only results from before it.</p>
    <div class="controls">${seg}</div>
    ${verdict ? `<p class="verdict ${avg.diff > 0 ? "bad" : "good"}">${verdict}</p>` : ""}
    <dl class="stats">
      <div><dt>Matches scored</dt><dd>${me.n}</dd></div>
      <div><dt>Model accuracy</dt><dd>${me.logloss.toFixed(3)} <small>${avg ? "bookmakers " + avg.logloss.toFixed(3) : ""}</small></dd></div>
      <div><dt>Favourite won</dt><dd>${pc(me.fav)} <small>${avg ? "bookmakers " + pc(avg.fav) : ""}</small></dd></div></dl>
    ${explain("How to read the accuracy score", `<p>The accuracy score (log loss) asks: how much chance did the forecast give to what actually happened? Giving the real result 60% scores 0.51; giving it 20% scores 1.61. Averaged over many matches, <strong>lower is better</strong>. Around 1.00 is typical for the Premier League; a coin-flip-style forecast of a third each scores 1.10.</p>
      <p><strong>Favourite won</strong> is easier to read but weaker: it ignores how confident each forecast was, and it swings a lot over 100 matches. Over a season the accuracy score is the fairer test.</p>
      <p><strong>Model on same matches</strong> scores the model on exactly the matches that source priced, so each comparison is like for like. <strong>vs model</strong> is how much more accurate the source was than the model on those matches: positive (red) means the source was better, negative (green) means the model was better, grey means the gap is within the ± range and could be luck.</p>`)}
    <div class="cs-scroll"><table class="cmp"><thead><tr><th>Source</th><th>Accuracy</th><th>Model, same matches</th><th>vs model</th><th>Favourite won</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="diff cs-note">Bookmaker chances use Football-Data's prices from the Friday (or Tuesday) before each round. Opta's figures appear for the rounds typed in from Opta Analyst's preview.</p>
    <p class="diff">${live.settled ? `Separately, ${live.settled} predictions logged live before kick-off have been settled: accuracy ${live.logloss.toFixed(3)}, favourite won ${pc(live.fav_hit)}.` : ""}</p>
    ${r.n ? `<details class="more-list"><summary>Every match this season (${r.n})</summary>${r.matches.map((x) => {
      const k = { H: 0, D: 1, A: 2 }[x.res], fav = x.p.indexOf(Math.max(...x.p));
      return `<div class="res"><span>${esc(x.home)} v ${esc(x.away)}</span><span class="sc">${x.score[0]}–${x.score[1]}</span>
        <span class="meta num">${esc(shortDay(x.date))}. Model gave this result ${pc(x.p[k])}${x.market ? `, bookmakers ${pc(x.market[k])}` : ""}. <span class="${fav === k ? "ok" : "miss"}">${fav === k ? "Model's favourite came in" : "Model's favourite missed"}</span></span></div>`;
    }).join("")}</details>` : ""}`;
}

const VERDICT = { edge: ["Real edge", "better"], promising: ["Promising", "same"], none: ["No edge", "same"], loses: ["Loses", "worse"], few: ["Too few bets", "same"], lucky: ["Ahead by luck", "same"] };
function recLab() {
  const lab = DATA.record.lab;
  if (!lab || !lab.rows || !lab.rows.length) return `<p class="empty">The strategy tests appear after the next update.</p>`;
  const nt = lab.notes || {}, groups = [...new Set(lab.rows.map((r) => r.group))];
  const edges = lab.rows.filter((r) => r.verdict === "edge"), losers = lab.rows.filter((r) => r.verdict === "loses");
  const row = (r) => {
    const [txt, cls] = VERDICT[r.verdict] || VERDICT.none;
    const sea = (r.seasons || []).map((x) => `${x.label.slice(2)} ${pcs(x.roi, 0)}`).join(" · ");
    return `<tr><td style="white-space:normal">${esc(r.name)}<small>${esc(r.how)}</small>${sea ? `<small>By season: ${esc(sea)}</small>` : ""}</td>
      <td>${r.n}</td><td>${r.roi != null ? `${pcs(r.roi)}${r.roi_ci != null ? `<small>±${(r.roi_ci * 100).toFixed(0)}%</small>` : ""}` : "–"}</td>
      <td>${r.clv != null ? `${pcs(r.clv)}${r.clv_ci != null ? `<small>±${(r.clv_ci * 100).toFixed(1)}%</small>` : ""}` : "–"}</td>
      <td><span class="${cls}" style="font-weight:600">${txt}</span></td></tr>`;
  };
  return `<p class="lede" style="margin-top:-.25rem">Every betting idea we have tried, re-run each round on ${nt.matches || ""} matches since ${esc(nt.from || "2024/25")}. 1 unit a bet at real pre-match prices.</p>
    <p class="verdict ${edges.length ? "good" : ""}">${edges.length ? `<strong>${edges.length === 1 ? "One strategy shows" : edges.length + " strategies show"} a real edge:</strong> ${edges.map((r) => esc(r.name.toLowerCase())).join("; ")}.` : "<strong>No strategy shows a proven edge yet.</strong>"}
      ${losers.length ? ` ${losers.length} clearly lose money.` : ""} Anything built on the model's own opinion has no edge; what works is taking prices above the sharp fair price.</p>
    ${explain("How to read the verdicts", `<ul>
      <li><strong>Return</strong> is profit per unit staked. Over a few hundred bets it swings a lot, so the ± range is wide.</li>
      <li><strong>Beat close</strong> is how far the odds taken were above the closing fair odds. It needs far fewer bets to trust, so the verdict leans on it.</li>
      <li><strong>Real edge</strong>: beat the close by more than its ± range, on 80+ bets. <strong>Promising</strong>: beat the close, but not yet beyond doubt. <strong>No edge</strong>: indistinguishable from the bookmaker's margin. <strong>Loses</strong>: below zero even at the top of its range.</li>
      <li>With this many ideas tested, one or two will look good by luck. Trust a strategy only when it holds in each season and has a reason behind it.</li></ul>`)}
    ${groups.map((g) => `<h3 class="day">${esc(g)}</h3><div class="cs-scroll"><table class="cmp"><thead><tr><th>Strategy</th><th>Bets</th><th>Return</th><th>Beat close</th><th>Verdict</th></tr></thead><tbody>${lab.rows.filter((r) => r.group === g).map(row).join("")}</tbody></table></div>`).join("")}
    <h3 class="day">Other checks</h3>
    <ul class="diff" style="padding-left:1.1rem">
      ${nt.arb_share != null ? `<li><strong>Arbitrage</strong> (best prices across bookmakers adding up to a sure profit) appeared in ${pc(nt.arb_share, 1)} of matches${nt.arb_profit != null ? `, locking in ${pc(nt.arb_profit, 1)} on average` : ""}: too rare and too thin to rely on.</li>` : ""}
      ${nt.blend_w != null ? `<li><strong>Blending the model with the sharp price</strong>: the most accurate mix over ${nt.blend_n} matches puts ${nt.blend_w <= 0 ? "no weight" : pc(nt.blend_w) + " weight"} on the model (accuracy score ${nt.ll_sharp.toFixed(3)} for the sharp price alone, ${nt.ll_model.toFixed(3)} for the model alone).${nt.blend_w <= 0 ? " The model adds nothing the market does not already know." : ""}</li>` : ""}
    </ul>
    <p class="diff cs-note">Prices are Football-Data's, collected on the Friday or Tuesday before each round; "best price" is the highest among the bookmakers it tracks. The sharp fair price is the average of Pinnacle and the Betfair Exchange with the margin removed. </p>`;
}

function recGoals() {

  const st = g.ou_strategies || [], acc = g.ou_accuracy || [], bt = g.btts_accuracy, live = (DATA.value || {}).lines;
  const me = acc.find((x) => x.model), ex = acc.find((x) => x.label === "Betfair Exchange") || acc.find((x) => !x.model);
  const val = st.find((x) => x.name.startsWith("Value at Bet365")), pick = st.find((x) => x.name === "Model's pick at Bet365");
  const srow = (r) => { const [txt, cls] = VERDICT[r.verdict] || VERDICT.none;
    return `<tr><td style="white-space:normal">${esc(r.name)}<small>${esc(r.how)}</small></td><td>${r.n}${r.wins != null ? `<small>${r.wins} won</small>` : ""}</td>
      <td>${r.roi != null ? `${pcs(r.roi)}${r.roi_ci != null ? `<small>±${(r.roi_ci * 100).toFixed(0)}%</small>` : ""}` : "–"}</td>
      <td>${r.clv != null ? `${pcs(r.clv)}${r.clv_ci != null ? `<small>±${(r.clv_ci * 100).toFixed(1)}%</small>` : ""}` : "–"}</td><td><span class="${cls}" style="font-weight:600">${txt}</span></td></tr>`; };

    verdict = `<p class="verdict ${ex.diff > 0 ? (sure ? "bad" : "") : "good"}"><strong>Over/under 2.5: ${ex.diff > 0 ? "the exchange has been more accurate than the model" : "the model has matched or beaten the exchange"}${sure ? "" : ", within the range of luck"}.</strong>
      Accuracy score ${me.logloss.toFixed(3)} for the model against ${ex.logloss.toFixed(3)} for the exchange on ${ex.n} matches (lower is better; a coin flip scores 0.693).
      ${pick && pick.roi != null ? ` Backing the model's side in every match returned ${pcs(pick.roi)} a bet (${rangeText(pick.roi, pick.roi_ci)}).` : ""}
      ${val ? ` Bet365's Friday price has beaten the exchange's fair price by ${(DATA.value_threshold * 100).toFixed(0)}%+ in ${val.n} match${val.n === 1 ? "" : "es"}.` : ""}</p>`;
  }
  return `<p class="lede" style="margin-top:-.25rem">Over/under 2.5 goals and both teams to score, ${esc(g.season)} only: ${g.n} real results to ${esc(shortDay(g.last))}, real bookmaker prices, and predictions made before each match.</p>
    <dl class="stats">
      <div><dt>Goals a match</dt><dd>${g.avg_goals.toFixed(2)}</dd></div>
      <div><dt>Over 2.5 goals</dt><dd>${pc(g.over_rate)} <small>model expected ${g.model_over != null ? pc(g.model_over) : "–"}</small></dd></div>
      <div><dt>Both teams scored</dt><dd>${pc(g.btts_rate)} <small>model expected ${g.model_btts != null ? pc(g.model_btts) : "–"}</small></dd></div></dl>
    ${verdict}
    <h3 class="day">Over/under 2.5: who forecasts it better</h3>
    <div class="cs-scroll"><table class="cmp"><thead><tr><th>Source</th><th>Accuracy</th><th>vs model</th><th>Right side</th></tr></thead><tbody>
      ${acc.map((x) => `<tr class="${x.model ? "mine" : ""}"><td>${esc(x.label)}<small>${x.n} matches</small></td><td>${x.logloss.toFixed(3)}</td>
        <td>${x.model ? "–" : `<span class="${x.diff_ci != null && Math.abs(x.diff) > x.diff_ci ? (x.diff > 0 ? "worse" : "better") : "same"}">${sgn(x.diff, 3)}</span>${x.diff_ci != null ? `<small>±${x.diff_ci.toFixed(3)}</small>` : ""}`}</td><td>${pc(x.hit)}</td></tr>`).join("")}</tbody></table></div>
    <p class="diff cs-note"><strong>Right side</strong>: how often the side each source rated above 50% happened. <strong>vs model</strong>: positive (red) means that source was more accurate than the model; grey is within the ± range. Bookmaker chances are Football-Data's pre-match prices with the margin removed.</p>
    <h3 class="day">Over/under 2.5: betting tests at real prices</h3>
    ${curves.length ? lineChart(curves.map((r, i) => ({ name: r.name, color: i ? "var(--s2)" : "var(--s1)", dash: !!i, points: r.curve })), { label: "Over/under strategies, cumulative profit in units" }) : ""}
    <div class="cs-scroll"><table class="cmp"><thead><tr><th>Strategy</th><th>Bets</th><th>Return</th><th>Beat close</th><th>Verdict</th></tr></thead><tbody>${st.map(srow).join("")}</tbody></table></div>
    <p class="diff cs-note">1 unit a bet at real prices from the Friday or Tuesday before each round: Bet365's, or the Betfair Exchange's after 2% commission. Beat close compares the odds with the exchange's closing price, margin removed. <strong>Ahead by luck</strong> means the bets made money but at odds worse than the closing fair price, so the profit came from results going their way, not from a better price; expect it to fade. A verdict needs 20+ bets; one season is a small sample, so the ± ranges (90% intervals) are wide. Football-Data's "best price" column is not used here: for goals this season about a third of its entries are stray quotes no one could bet.</p>

        <div><dt>Right side</dt><dd>${pc(bt.hit)} <small>"yes" happened ${pc(bt.yes_rate)}</small></dd></div></dl>

        : `<strong>The model adds nothing yet.</strong> Its score of ${bt.logloss.toFixed(3)} is no better than always quoting this season's average rate (${bt.base.toFixed(3)}), a yardstick that has the benefit of hindsight.`} Whether that is enough to beat bookmaker prices can only be judged against real BTTS odds.</p>
      ${bt.bins && bt.bins.length ? `<div class="cs-scroll"><table class="cmp"><thead><tr><th>Model said</th><th>Matches</th><th>Average forecast</th><th>Both scored</th></tr></thead><tbody>
        ${bt.bins.map((x) => `<tr><td>${pc(x.lo)} to ${pc(x.hi)}</td><td>${x.n}</td><td>${pc(x.predicted)}</td><td>${pc(x.actual)}</td></tr>`).join("")}</tbody></table></div>
        <p class="diff cs-note">A good forecast has "both scored" close to the average forecast in each row, and rising down the table.</p>` : ""}` : `<p class="diff">Not enough matches yet.</p>`}
    <p class="note"><strong>BTTS betting record: starts now.</strong> Football-Data has no both-teams-to-score odds, so there is no real price history to test on, and nothing is invented to fill the gap. The site now collects real BTTS prices in the week of each match and logs any value bet against the sharp price. ${live && live.logged ? `${live.logged} goals bet${live.logged === 1 ? "" : "s"} logged so far, ${live.settled} settled; see Value bets.` : "No goals value bet has qualified yet."}</p>`;
}

function recFav() {
  const list = DATA.record.favourites || [];
  if (!list.length) return `<p class="empty">No matches to test yet.</p>`;
  const [w, seg] = winSeg(list);
  const pr = w.prices.find((x) => x.key === favPrice) || w.prices[0];
  if (!pr) return `<div class="controls">${seg}</div><p class="empty">No prices for this period.</p>`;
  const pseg = `<span class="seg" role="group" aria-label="Odds taken">${w.prices.map((x) => `<button type="button" data-favprice="${x.key}" aria-pressed="${x.key === pr.key}">${esc(x.label)}</button>`).join("")}</span>`;
  const m = pr.model, b = pr.book, md = pr.model_diff, bd = pr.book_diff;
  let concl, cls;
  if (m.roi_ci != null && m.roi - m.roi_ci > 0) { concl = "That is a profit even at the bottom of the range: worth following, and worth checking against the closing price below."; cls = "good"; }
  else if (m.roi_ci != null && m.roi + m.roi_ci < 0) { concl = "That loses money even at the top of the range, so backing the model's favourite is not a betting strategy on its own."; cls = "bad"; }
  else { concl = "The range includes both profit and loss, so this period is too short to tell."; cls = ""; }
  const verdict = `<p class="verdict ${cls}"><strong>Backing the model's favourite in all ${m.n} matches won ${pc(m.hit)} of bets and returned ${pcs(m.roi)} per bet</strong> (${rangeText(m.roi, m.roi_ci)}) at ${esc(pr.label)} odds. Backing the bookmakers' favourite won ${pc(b.hit)} and returned ${pcs(b.roi)}. ${concl}</p>
    <p class="diff">The two agree on ${pc(pr.agree)} of matches, so most of these bets are the same. The test that matters is the ${md.n} matches where they disagree: there the model's pick won ${pc(md.hit)} (return ${pcs(md.roi)}) and the bookmakers' pick won ${pc(bd.hit)} (return ${pcs(bd.roi)}).</p>`;
  const row = (name, x) => `<tr><td style="white-space:normal">${name}<small>${x.n} bets · odds ${x.odds != null ? x.odds.toFixed(2) : "–"} · beat close ${pcs(x.clv)}</small></td><td>${pc(x.hit)}</td>
      <td class="${x.roi >= 0 ? "better" : "worse"}">${pcs(x.roi)}${x.roi_ci != null ? `<small>±${(x.roi_ci * 100).toFixed(1)}%</small>` : ""}</td><td>${units(x.profit)}</td></tr>`;
  return `<p class="lede" style="margin-top:-.25rem">Can the model's picks make money? This bets 1 unit on a favourite in every match, at real bookmaker odds, using only predictions made before each match.</p>
    <div class="controls">${seg}${pseg}</div>
    ${verdict}
    ${lineChart([{ name: "Model's favourite", color: "var(--s1)", points: pr.curve.model }, { name: "Bookmakers' favourite", color: "var(--s2)", dash: true, points: pr.curve.book }],
      { label: "Cumulative profit backing each favourite, in units" })}
    <div class="cs-scroll"><table class="cmp"><thead><tr><th>Strategy</th><th>Won</th><th>Return</th><th>Profit</th></tr></thead><tbody>
      ${row("Model's favourite, every match", m)}${row("Bookmakers' favourite, every match", b)}
      ${row("Model's pick, when they disagree", md)}${row("Bookmakers' pick, when they disagree", bd)}</tbody></table></div>
    <p class="diff cs-note"><strong>Return</strong> is profit per unit staked, with the 90% range underneath; <strong>profit</strong> is in units (1 unit a bet). <strong>Beat close</strong> compares the odds taken with the Betfair Exchange's closing price, margin removed: a negative number means the bet was worse than fair at kick-off.</p>
    ${explain("Why winning more often is not the same as making money", `<ul>
      <li><strong>Favourites pay short odds.</strong> At average odds of ${m.odds != null ? m.odds.toFixed(2) : "2.00"} you need to win ${m.odds != null ? pc(1 / m.odds) : "50%"} of bets just to break even, and the bookmaker's margin (about 5%) is built into every price.</li>
      <li><strong>Most picks are the same.</strong> When the model and the bookmakers agree, backing either favourite is the same bet at the same price, and the margin makes it a small loser on average.</li>
      <li><strong>The edge has to come from disagreements.</strong> If the model's favourite keeps winning when the bookmakers think otherwise, the model knows something the prices do not. That is the row to watch.</li>

        <span class="betacts">${["won", "lost", "void"].map((x) => `<button type="button" data-bet="${esc(b.id)}" data-set="${x}" aria-pressed="${b.manual === x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join("")}${b.manual ? `<button type="button" data-bet="${esc(b.id)}" data-set="">Auto</button>` : ""}<button type="button" data-bet="${esc(b.id)}" data-del="1">Delete</button></span></span></div>`).join("");
  return `<h2>My bets</h2>
    <p class="lede">Log the bets you actually place. EdgeLab settles them from the results and tells you whether you are beating the closing price.</p>
    <p class="note"><strong>Private to this device.</strong> Your bets are saved only in this browser, on this phone or computer. Nobody else can see them, including anyone you share the site with, and they do not sync between devices. Use Back up below to keep a copy.${betStoreOk ? "" : " <strong>This browser is blocking storage (private mode?), so bets will be lost when you close the page.</strong>"}</p>
    ${tiles}${verdict}
    ${st.curve.length > 2 ? `<h3 class="day">Your bank</h3>${lineChart([{ name: "Bank", color: "var(--s1)", points: st.curve }], { label: "Bank after each settled bet", fmt: (v) => money(v), plain: true, zero: false })}` : ""}
    <h3 class="day">Add a bet</h3>${form}
    ${bookRows ? `<h3 class="day">By bookmaker</h3><div class="cs-scroll"><table class="cmp"><thead><tr><th>Bookmaker</th><th>Bets</th><th>Staked</th><th>Profit</th><th>Beat close</th></tr></thead><tbody>${bookRows}</tbody></table></div>` : ""}
    <h3 class="day">Your bets${st.rows.length ? ` (${st.rows.length})` : ""}</h3>
    ${list ? `<div class="vlist">${list}</div><p class="diff cs-note">Premier League bets on a result, over/under 2.5 or both teams to score settle themselves once the result is in. Use Won, Lost or Void for anything else, or to correct one. Betfair Exchange winnings have 2% commission taken off. Beat the close is available for results and over/under 2.5.</p>` : `<p class="diff">No bets yet. Add one above, or tap "Log this bet" on any value bet.</p>`}
    <h3 class="day">Settings and back-up</h3>
    <form id="betsettings" class="betform"><div class="three">
      <label>Starting bank<input name="bank" inputmode="decimal" value="${esc(s.bank)}"></label>
      <label>Currency<select name="cur">${["£", "€", "$"].map((c) => opt(c, c, s.cur)).join("")}</select></label>
      <label>Stake size<select name="kelly">${[[0.125, "Eighth Kelly"], [0.25, "Quarter Kelly"], [0.5, "Half Kelly"]].map(([v, l]) => opt(v, l, s.kelly)).join("")}</select></label></div></form>
    <div class="betacts" style="margin-top:.6rem"><button type="button" id="betexport">Back up to a file</button><button type="button" id="betimport">Restore from a file</button><input type="file" id="betfile" accept="application/json,.json" hidden>
      ${st.rows.length ? `<button type="button" id="betclear">Delete all bets</button>` : ""}</div>
    <p class="diff cs-note">Kelly staking sizes each bet by its edge; a quarter of the full amount is a common cautious choice. Only bet what you can afford to lose. 18+, <a href="https://www.begambleaware.org" rel="noopener">BeGambleAware</a>.</p>`;
}
function wireBets() {
  document.querySelectorAll("[data-log]").forEach((b) => (b.onclick = (ev) => {
    ev.preventDefault(); ev.stopPropagation();
    const d = JSON.parse(b.dataset.log);
    betDraft = { fi: d.fi, market: d.market, book: BET_BOOKS.includes(d.book) ? d.book : "Other", odds: d.odds ? (+d.odds).toFixed(2) : "", stake: "", fair: "" }; betMsg = "";
    location.hash = "bets";
  }));
  const form = $("#betform"); if (!form) return;
  const read = () => { const fd = new FormData(form), d = { ...betDraft }; for (const [k, v] of fd.entries()) d[k] = v; d.fi = +d.fi; return d; };
  form.querySelectorAll("select").forEach((el) => (el.onchange = () => {
    const prev = betDraft, d = read();
    if (d.fi !== prev.fi || d.market !== prev.market) { d.fair = ""; d.odds = ""; } else if (d.book !== prev.book) d.odds = "";
    betDraft = d; betMsg = ""; render();
  }));
  // typing never redraws the form (a redraw would swallow the tap on Save); only the hint line updates
  form.querySelectorAll("input").forEach((el) => (el.oninput = () => { betDraft = read(); $("#bethint").innerHTML = betHint(betDraft); }));
  form.onsubmit = (ev) => {
    ev.preventDefault();
    const d = read(), f = d.fi >= 0 ? DATA.fixtures[d.fi] : null;
    const odds_ = parseFloat(String(d.odds).replace(",", ".")), stake = parseFloat(String(d.stake).replace(",", ".")), fair = parseFloat(String(d.fair).replace(",", "."));
    if (!(odds_ > 1) || !(stake > 0)) { betDraft = d; betMsg = "Enter odds above 1 and a stake above 0."; render(); return; }
    betStore.bets.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), placed: new Date().toISOString(),
      date: f ? f.date : d.date, home: (f ? f.home : d.home || "").trim(), away: (f ? f.away : d.away || "").trim(), market: d.market, label: d.market === "other" ? (d.label || "").trim() : "",
      book: d.book, odds: odds_, stake, fair: fair > 1 ? fair : null, manual: null });
    saveBets(); betDraft = null; betMsg = "Saved."; render();
  };
  document.querySelectorAll("[data-bet]").forEach((b) => (b.onclick = () => {
    const i = betStore.bets.findIndex((x) => x.id === b.dataset.bet); if (i < 0) return;
    if (b.dataset.del) { if (b.dataset.sure) betStore.bets.splice(i, 1); else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return; } }
    else betStore.bets[i].manual = b.dataset.set || null;
    saveBets(); render();
  }));
  const set = $("#betsettings");
  set.querySelectorAll("input,select").forEach((el) => (el.onchange = () => {
    const fd = new FormData(set), bank = parseFloat(String(fd.get("bank")).replace(",", "."));
    betStore.settings = { bank: bank >= 0 ? bank : betStore.settings.bank, cur: fd.get("cur"), kelly: parseFloat(fd.get("kelly")) || 0.25 };
    saveBets(); render();
  }));
  $("#betexport").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(betStore, null, 1)], { type: "application/json" }));
    a.download = `edgelab-bets-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $("#betimport").onclick = () => $("#betfile").click();
  $("#betfile").onchange = (ev) => {
    const file = ev.target.files[0]; if (!file) return;
    file.text().then((t) => {
      try {
        const d = JSON.parse(t); if (!d || !Array.isArray(d.bets)) throw new Error("not a back-up");
        const ok = d.bets.filter((b) => b && b.id && b.home && b.away && b.odds > 1 && b.stake > 0);
        const have = new Set(betStore.bets.map((b) => b.id));
        betStore.bets.push(...ok.filter((b) => !have.has(b.id)));
        if (d.settings && !have.size) betStore.settings = { ...betStore.settings, ...d.settings };
        saveBets(); betMsg = `Restored ${ok.length} bets.`;
      } catch (e) { betMsg = "That file is not an EdgeLab back-up."; }
      render();
    });
  };
  const clr = $("#betclear");
  if (clr) clr.onclick = () => { if (clr.dataset.sure) { betStore.bets = []; saveBets(); render(); } else { clr.dataset.sure = "1"; clr.textContent = "Tap again to delete everything"; } };
}
loadBets();


function viewAbout() {
  const m = DATA.model;
  return `<div class="prose"><h2>How it works</h2>
    <p>EdgeLab gives each team two numbers: how many goals it tends to score and how many it tends to concede, adjusted for the strength of the opponents it has faced. A home side gets a boost (currently ${m.home.toFixed(2)} times its usual scoring rate). Recent matches count more than old ones; a match from a year ago counts about half as much as last week's.</p>
    <p>For each fixture the model works out the chance of every possible score, from 0–0 upwards, and adds them up into the chance of a home win, a draw and an away win. The method follows Dixon and Coles (1997), fitted to ${m.matches.toLocaleString()} Premier League matches since 2023.</p>
    <h3>What the numbers mean</h3>
    <p>Fair odds are the decimal odds at which a bet would break even if the model were exactly right: 1 divided by the probability. The thin black marks under each bar show how the bookmakers split the same match, once their margin is removed.</p>
    <h3>How good is it?</h3>
    <p>Tested on 810 past matches it had never seen (August 2024 to September 2026), the model was slightly less accurate than every bookmaker we compared: Bet365, the Betfair Exchange, Pinnacle and the market average were all within a whisker of each other and a little ahead of the model. On its own, the model does not find value: bets it rated as value got no better prices than picking at random. The <a href="#record/model">Track record</a> tab keeps this comparison up to date, and <a href="#record/fav">Betting the favourites</a> tests whether backing the model's picks makes money.</p>
    <h3>Finding value</h3>
    <p>Value bets on this site come from comparing prices, not from the model. The Betfair Exchange (and Pinnacle, when available) prices each match with almost no margin, so its odds are the fairest estimate of the true chances. Now and then an ordinary bookmaker offers better odds than that fair price. Only UK-licensed sportsbooks are compared; Bet365 and Betfair Sportsbook are marked as "your bookmaker". When one beats it by ${(DATA.value_threshold * 100).toFixed(0)}% or more, it is listed as a value bet.</p>
    <p>Tested on the same 810 matches, this rule found 120 bets. On average they got prices 4.8% better than the exchange's closing price (range 3.1% to 6.5%), and they did so in every season tested. Profit was +18.7% but over so few bets that luck dominates (range −10% to +49%). Prices move quickly, the best price is not always with a bookmaker you can use, and bookmakers limit accounts that win, so treat this as a strong lead, not a guarantee. Every value bet is logged before kick-off and settled on the <a href="#record/value">Track record</a> tab, so the rule can be checked in the open.</p>
    ${DATA.odds_api_credits != null ? `<p class="diff">Live odds feed: ${esc(DATA.odds_api_credits)} free API credits left this month. A full snapshot of every bookmaker uses 2; a quick one of ten key bookmakers uses 1. See Market moves for the schedule.</p>` : ""}
    <h3>Words used on this site</h3>
    <dl class="gloss">
      <dt>Decimal odds</dt><dd>What a 1-unit winning bet returns, stake included: 2.50 returns 2.50 (1.50 profit).</dd>
      <dt>Chance</dt><dd>1 divided by the odds. Odds of 2.50 imply a 40% chance.</dd>
      <dt>Margin</dt><dd>A bookmaker's built-in edge: its chances for home, draw and away add up to more than 100%, typically 104% to 107%.</dd>
      <dt>Fair odds</dt><dd>Odds with the margin removed, so the chances add up to exactly 100%.</dd>
      <dt>Sharp price</dt><dd>The Betfair Exchange and Pinnacle: big, low-margin markets that react fastest to news. We use them as the fair price.</dd>
      <dt>Value bet</dt><dd>A bookmaker's odds at least ${(DATA.value_threshold * 100).toFixed(0)}% above the sharp fair odds.</dd>
      <dt>Closing price</dt><dd>The exchange's odds at kick-off, when all team news is known: the market's final verdict.</dd>
      <dt>Beat the close (CLV)</dt><dd>How much better your odds were than the closing fair odds. Consistently positive means a real edge, whatever the results.</dd>
      <dt>Accuracy score</dt><dd>Log loss: how little chance a forecast gave to what happened. Lower is better.</dd>
      <dt>Quarter-Kelly</dt><dd>A cautious stake size: a quarter of the Kelly (1956) formula, value divided by (odds minus 1).</dd>
      <dt>Unit</dt><dd>One standard stake. Profit in units is profit if every bet were the same size.</dd>
    </dl>
    <h3>Betting</h3>
    <p>If you bet, only bet what you can afford to lose. You must be 18 or over. Free, confidential help is available from <a href="https://www.begambleaware.org" rel="noopener">BeGambleAware</a>.</p></div>`;
}

const VIEWS = { fixtures: viewFixtures, moves: viewMoves, books: viewBooks, ratings: viewRatings, record: viewRecord, bets: viewBets, about: viewAbout };
function render() {
  renderTabs(); $("#main").innerHTML = VIEWS[tab()]();
  document.querySelectorAll("[data-win]").forEach((b) => (b.onclick = () => { boardWin = b.dataset.win; render(); }));
  document.querySelectorAll("[data-rec]").forEach((b) => (b.onclick = () => { location.hash = "record/" + b.dataset.rec; }));
  document.querySelectorAll("[data-recwin]").forEach((b) => (b.onclick = () => { recWin = b.dataset.recwin; render(); }));
  document.querySelectorAll("[data-favprice]").forEach((b) => (b.onclick = () => { favPrice = b.dataset.favprice; render(); }));
  wireCharts(); wireBets();
  document.querySelectorAll("[data-cs]").forEach((b) => (b.onclick = () => {
    const i = +b.dataset.cs, mode = b.dataset.mode;
    $("#cs-" + i).innerHTML = grid(DATA.fixtures[i].grid, mode);
    b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  }));
}
let lastTab = null;
window.addEventListener("hashchange", () => { const t = tab(); render(); if (t !== lastTab) window.scrollTo(0, 0); lastTab = t; });

$("#theme").onclick = () => {
  const root = document.documentElement;
  const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  root.dataset.theme = cur === "dark" ? "light" : "dark";
  try { localStorage.setItem("edgelab-theme", root.dataset.theme); } catch (e) {}
};
try { const t = localStorage.getItem("edgelab-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

if (!DATA) { $("#main").innerHTML = `<p class="empty">No forecast data in this page. Run build.py to generate it.</p>`; }
else {
  $("#sub").textContent = `${DATA.league} forecasts, ${DATA.season}`;
  const g = DATA.generated.slice(0, 10);
  $("#foot").innerHTML = `Updated ${esc(parseLocal(DATA.generated).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" }))}. Results to ${esc(shortDay(DATA.last_result))}. Odds from football-data.co.uk${DATA.odds_api ? " and The Odds API" : ""}; Opta supercomputer figures from <a href="https://theanalyst.com/articles/premier-league-match-predictions" rel="noopener">Opta Analyst</a>. Kick-off times are UK time. Not betting advice. 18+, <a href="https://www.begambleaware.org" rel="noopener">BeGambleAware</a>.`;
  render();
}
