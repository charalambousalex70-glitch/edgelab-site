<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Premier League probabilities from the EdgeLab model, compared with Opta, Bet365, the Betfair Exchange and Pinnacle, with value bets checked against the exchange.">
<title>EdgeLab: Premier League forecasts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EdgeLab">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" id="themecolor">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#FFFFFF; --panel:#F4F7F3; --card:#FFFFFF; --text:#0B1F1A; --muted:#45544E; --faint:#66736D; --line:#E0E6E1;
  --primary:#12855B; --home:#12855B; --draw:#9AA5A0; --away:#D97706; --pos:#0B7A52; --neg:#BE123C;
  --chip:#E6F4EC; --chip-text:#0F5A40; --heat:18,133,91; --s1:#12855B; --s2:#D97706; --logo1:#103C35; --logo2:#18725A;
  --brand:#103C35; --lime:#BDFB54; --on-brand:#FAFFF3; --shadow:0 1px 2px rgba(11,31,26,.05), 0 4px 14px rgba(11,31,26,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0B1411; --panel:#13201B; --card:#101B17; --text:#F3F8F2; --muted:#C2CEC7; --faint:#8E9C95; --line:#24342E;
    --primary:#3CCB8F; --home:#24AD78; --draw:#5E6C66; --away:#E08A0B; --pos:#4ADE9A; --neg:#FB7185;
    --chip:#12332A; --chip-text:#B9F0D2; --heat:36,173,120; --s1:#24AD78; --s2:#D97706; --logo1:#FAFFF3; --logo2:#BDFB54;
    --brand:#103C35; --lime:#BDFB54; --on-brand:#FAFFF3; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
    --bg:#0B1411; --panel:#13201B; --card:#101B17; --text:#F3F8F2; --muted:#C2CEC7; --faint:#8E9C95; --line:#24342E;
    --primary:#3CCB8F; --home:#24AD78; --draw:#5E6C66; --away:#E08A0B; --pos:#4ADE9A; --neg:#FB7185;
    --chip:#12332A; --chip-text:#B9F0D2; --heat:36,173,120; --s1:#24AD78; --s2:#D97706; --logo1:#FAFFF3; --logo2:#BDFB54;
    --brand:#103C35; --lime:#BDFB54; --on-brand:#FAFFF3; --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 7rem); }
@media (max-width: 719px) { html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 4.75rem); } }
*, *::before, *::after { box-sizing: inherit; }
body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
a { color: var(--primary); }
.wrap { max-width: 44rem; margin: 0 auto; padding: 0 1rem; }

header { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); margin-top: calc(-1 * env(safe-area-inset-top, 0px)); }
.brand { display:flex; align-items:center; gap:.55rem; padding:.7rem 0 .2rem; }
.lgbtn { margin-left:auto; max-width:46%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:600 .8rem "IBM Plex Sans", sans-serif; color:var(--chip-text); background:var(--chip); border-radius:999px; padding:.3rem .7rem; text-decoration:none; }
.lgbtn::after { content:" ▾"; font-size:.7rem; }
.lgbtn[hidden] { display:none; }
.lgbtn:not([hidden]) + .theme { margin-left:.2rem; }
.lgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(15.5rem, 1fr)); gap:.6rem; margin:.8rem 0 1.4rem; }
.lcard { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:.8rem .9rem; box-shadow:var(--shadow); }
.lcard:hover { border-color:color-mix(in srgb, var(--primary) 45%, var(--line)); }
.lcard.cur { border-color:var(--primary); }
.lcard .lt { display:flex; align-items:baseline; justify-content:space-between; gap:.5rem; }
.lcard b { font-size:1rem; }
.lcard .cty { font-size:.75rem; color:var(--faint); }
.lcard .tags { display:flex; flex-wrap:wrap; gap:.3rem; margin:.45rem 0 .35rem; }
.lcard .tag { font-size:.68rem; font-weight:600; border-radius:999px; padding:.08rem .5rem; background:var(--panel); color:var(--muted); }
.lcard .tag.live { background:var(--brand); color:var(--lime); }
.lcard .tag.val { background:var(--lime); color:var(--brand); }
.lcard .tag.edge { background:var(--chip); color:var(--chip-text); }
.lcard .meta { font-size:.78rem; color:var(--muted); }
.brand h1 { margin:0; line-height:0; }
.brand h1 svg { display:block; }
.btn { font:600 .9rem "IBM Plex Sans", sans-serif; background:var(--brand); color:var(--on-brand); border:0; border-radius:999px; padding:.55rem 1.1rem; cursor:pointer; }
.lg1 { fill:var(--logo1); } .lg2 { fill:var(--logo2); }
.brand small { display:block; font-size:.78rem; color:var(--faint); font-weight:400; margin-top:.3rem; }
.theme { margin-left:auto; background:none; border:0; color:var(--muted); padding:.4rem; border-radius:6px; cursor:pointer; }
#tabs { display:flex; gap:.25rem; overflow-x:auto; padding:.5rem 0 .6rem; scrollbar-width:none; }
#tabs::-webkit-scrollbar { display:none; }
#tabs button { font: 500 .9rem "IBM Plex Sans", sans-serif; background:none; border:0; color:var(--muted); padding:.4rem .75rem; border-radius:999px; cursor:pointer; white-space:nowrap; }
#tabs button[aria-selected="true"] { background:var(--text); color:var(--bg); }
.fresh { display:flex; align-items:center; gap:.35rem; }
.fresh i { flex:none; width:.5rem; height:.5rem; border-radius:50%; background:var(--pos); }
.fresh.stale { color:var(--away); } .fresh.stale i { background:var(--away); border-radius:1px; transform:rotate(45deg); }
#bnav, #moresheet { display:none; }
@media (max-width: 719px) {
  #tabs { display:none; }
  .brand { padding-bottom:.65rem; }
  body { padding-bottom: calc(3.6rem + env(safe-area-inset-bottom, 0px)); }
  #bnav { display:grid; grid-template-columns:repeat(5, 1fr); position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
  #bnav button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem; min-height:3.5rem; background:none; border:0; color:var(--faint); font:500 .7rem "IBM Plex Sans", sans-serif; cursor:pointer; padding:.3rem 0; -webkit-tap-highlight-color:transparent; }
  #bnav button[aria-current="page"], #bnav button[aria-expanded="true"] { color:var(--primary); }
  #bnav .dot { position:absolute; margin:-.15rem 0 0 1.3rem; min-width:1rem; height:1rem; border-radius:999px; background:var(--pos); color:var(--bg); font-size:.62rem; line-height:1rem; text-align:center; padding:0 .25rem; }
  #moresheet.open { display:block; position:fixed; right:.5rem; bottom:calc(3.9rem + env(safe-area-inset-bottom, 0px)); z-index:21; background:var(--bg); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(15,23,42,.18); padding:.3rem; min-width:11rem; }
  #moresheet button { display:block; width:100%; text-align:left; background:none; border:0; color:var(--text); font:500 .95rem "IBM Plex Sans", sans-serif; padding:.7rem .8rem; border-radius:7px; cursor:pointer; }
  #moresheet button[aria-current="page"] { background:var(--panel); color:var(--primary); }
}
.today { display:grid; grid-template-columns:repeat(2, 1fr); gap:.5rem; margin:.75rem 0 1.25rem; }
@media (min-width: 600px) { .today { grid-template-columns:repeat(4, 1fr); } }
.today a { display:block; background:var(--panel); border-radius:8px; padding:.65rem .75rem; text-decoration:none; color:inherit; min-width:0; }
.today dt, .today .k { display:block; font-size:.78rem; color:var(--faint); }
.today .v { display:block; font-size:1.3rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.3; }
.today .s { display:block; font-size:.78rem; color:var(--muted); overflow-wrap:anywhere; }
.today a { display:flex; flex-direction:column; }
.today .v.pos { color:var(--pos); }
table.cmp td.topp { font-weight:600; }
.vrow.off { opacity:.6; }

main { padding: 1.25rem 0 3rem; }
h2 { font: 600 1.35rem/1.25 "IBM Plex Sans", sans-serif; letter-spacing:-.015em; margin:0 0 .25rem; }
.lede { color:var(--muted); margin:0 0 1.25rem; font-size:.95rem; max-width: 36rem; }
.day { font: 600 .95rem "IBM Plex Sans", sans-serif; margin: 1.5rem 0 .25rem; color: var(--muted); }
.legend { display:flex; gap:1rem; font-size:.8rem; color:var(--faint); margin:-.5rem 0 1rem; flex-wrap:wrap; }
.legend i { display:inline-block; width:.7rem; height:.7rem; border-radius:2px; margin-right:.3rem; vertical-align:-1px; }
.tick-key { display:inline-block; width:2px; height:.8rem; background:var(--text); margin-right:.35rem; vertical-align:-2px; }

details.fx { border-top: 1px solid var(--line); }
details.fx:last-of-type { border-bottom: 1px solid var(--line); }
details.fx summary { list-style:none; cursor:pointer; padding: .85rem 0 .9rem; }
details.fx summary::-webkit-details-marker { display:none; }
.teams { display:grid; grid-template-columns: 1fr auto 1fr; align-items:baseline; gap:.5rem; font: 600 1.05rem/1.25 "IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; }
.teams .a { text-align:right; }
.teams .t { font: 400 .8rem "IBM Plex Sans", sans-serif; color:var(--faint); text-align:center; }
.split { position:relative; display:flex; height: 1.9rem; border-radius: 5px; overflow:hidden; margin-top:.55rem; font: 600 .82rem/1.9rem "IBM Plex Sans", sans-serif; color:#fff; }
.split span { display:block; text-align:center; white-space:nowrap; overflow:hidden; }
.split .h { background:var(--home); } .split .d { background:var(--draw); } .split .w { background:var(--away); color:#1F1300; }
.mkt { position:relative; height:.55rem; margin-top:2px; }
.mkt b { position:absolute; top:0; width:2px; height:.55rem; background:var(--text); transform:translateX(-1px); }
.hint { display:flex; justify-content:space-between; font-size:.78rem; color:var(--faint); margin-top:.15rem; }
.more { padding: 0 0 1rem; display:grid; grid-template-columns: minmax(0, 1fr); gap: .9rem; }
.more > * { min-width: 0; }
.facts { display:grid; grid-template-columns: repeat(3, 1fr); gap:.5rem; }
.facts div { background:var(--panel); border-radius:6px; padding:.5rem .6rem; }
.facts dt { font-size:.75rem; color:var(--faint); }
.facts dd { margin:0; font-weight:600; font-variant-numeric: tabular-nums; }
.scores { display:flex; flex-wrap:wrap; gap:.4rem; }
.scores span { font-size:.85rem; background:var(--chip); color:var(--chip-text); border-radius:999px; padding:.15rem .6rem; font-variant-numeric: tabular-nums; }
.cs-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; flex-wrap:wrap; margin-bottom:.4rem; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.seg button { font: 500 .78rem "IBM Plex Sans", sans-serif; background:none; border:0; color:var(--muted); padding:.25rem .65rem; cursor:pointer; }
.seg button[aria-pressed="true"] { background:var(--text); color:var(--bg); }
.cs-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:6px; }
.grid { border-collapse: separate; border-spacing: 2px; font-size:.74rem; font-variant-numeric: tabular-nums; }
.grid th { color:var(--faint); font-weight:500; padding:0 .25rem; background:var(--bg); }
.grid th[scope="row"], .grid th.corner { position:sticky; left:0; z-index:1; }
.grid td { min-width: 2.7rem; height: 1.85rem; text-align:center; border-radius:3px; white-space:nowrap; }
.cs-note { margin:.4rem 0 0; font-size:.78rem; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.cmp { width:100%; border-collapse:collapse; font-size:.85rem; font-variant-numeric: tabular-nums; }
.cmp th { text-align:right; font-weight:500; color:var(--faint); font-size:.75rem; padding:.3rem .25rem; border-bottom:1px solid var(--line); }
.cmp th:first-child, .cmp td:first-child { text-align:left; }
.cmp td { text-align:right; padding:.4rem .25rem; border-bottom:1px solid var(--line); white-space:nowrap; }
.cmp td small { display:block; color:var(--faint); font-size:.72rem; }
.cmp tr.sharp td { font-weight:600; }
.cmp tr.mine td:first-child { color:var(--primary); font-weight:600; }
.cmp td.best { color:var(--pos); font-weight:600; }
.cmp tr.ref td, .cmp tr.mine2 td { background:var(--panel); }
.cmp tr.exch td:first-child small, .cmp td:first-child small { display:block; color:var(--faint); font-size:.72rem; font-weight:400; }
.better { color:var(--pos); } .worse { color:var(--neg); } .same { color:var(--muted); }
.valbox { border:1px solid var(--pos); border-radius:8px; padding:.65rem .8rem; }
.valbox h4 { margin:0 0 .25rem; font-size:.95rem; color:var(--pos); }
.valbox p { margin:.15rem 0; font-size:.85rem; color:var(--muted); }
.valbox strong { color:var(--text); }
.vlist { border-top:1px solid var(--line); margin-bottom:1.25rem; }
.vrow { display:grid; grid-template-columns: 1fr auto; gap:.1rem .75rem; padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.92rem; }
.vrow .ev { font-weight:600; color:var(--pos); font-variant-numeric: tabular-nums; text-align:right; }
.vrow .meta { grid-column:1 / -1; font-size:.8rem; color:var(--faint); }
.note { background:var(--panel); border-radius:8px; padding:.7rem .85rem; font-size:.85rem; color:var(--muted); margin:0 0 1.25rem; }
.note strong { color:var(--text); }
.diff { font-size:.85rem; color:var(--muted); }
.diff strong { color: var(--text); }

table.r { width:100%; border-collapse:collapse; font-size:.92rem; }
table.r th { text-align:left; font-weight:500; color:var(--faint); font-size:.78rem; padding:.4rem .3rem; border-bottom:1px solid var(--line); }
table.r td { padding:.55rem .3rem; border-bottom:1px solid var(--line); font-variant-numeric: tabular-nums; }
table.r .n { text-align:right; }
.mv { font-size:.75rem; width:2.2rem; } .up { color:var(--pos); } .dn { color:var(--neg); } .eq { color:var(--faint); }
.bar { position:relative; height:.5rem; background:var(--panel); border-radius:3px; min-width:3rem; }
table.r td:nth-child(3) { overflow-wrap:anywhere; }
.bar i { position:absolute; top:0; height:.5rem; border-radius:3px; }
.bar::after { content:""; position:absolute; left:50%; top:-2px; width:1px; height:calc(.5rem + 4px); background:var(--faint); }

.stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:.5rem; margin-bottom:1.25rem; }
.stats div { background:var(--panel); border-radius:8px; padding:.7rem .8rem; }
.stats dt { font-size:.8rem; color:var(--faint); }
.stats dd { margin:.1rem 0 0; font-size:1.35rem; font-weight:600; font-variant-numeric: tabular-nums; }
.stats dd small { display:block; font-size:.78rem; font-weight:400; color:var(--faint); }
.res { display:grid; grid-template-columns: 1fr auto; gap:.1rem .75rem; padding:.6rem 0; border-bottom:1px solid var(--line); font-size:.92rem; }
.res .sc { font-weight:600; font-variant-numeric: tabular-nums; text-align:right; }
.res .meta { grid-column: 1 / -1; font-size:.8rem; color:var(--faint); }
.ok { color:var(--pos); } .miss { color:var(--neg); } .vrow .ev.miss { color:var(--neg); }

.mcard { border-top:1px solid var(--line); padding:.8rem 0 .9rem; }
.mcard .teams { font-size:1rem; }
.spark { display:block; width:100%; height:64px; margin:.45rem 0 .2rem; }
.spark line.base { stroke:var(--line); }
.mrow { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:.4rem; font-size:.8rem; color:var(--faint); font-variant-numeric: tabular-nums; }
.mrow b { display:block; color:var(--text); font-weight:600; font-size:.9rem; }
.lagbox { margin-top:.5rem; font-size:.82rem; color:var(--muted); background:var(--panel); border-radius:6px; padding:.45rem .6rem; }
.lagbox strong { color:var(--text); }
.hbar { display:grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr) 3.2rem; gap:.5rem; align-items:center; font-size:.82rem; padding:.25rem 0; }
.hbar .track { background:var(--panel); border-radius:3px; height:.7rem; position:relative; }
.hbar .track i { position:absolute; left:0; top:0; bottom:0; background:var(--primary); border-radius:3px; }
.hbar .v { text-align:right; font-variant-numeric: tabular-nums; color:var(--muted); }
.why { display:block; font-size:.8rem; color:var(--muted); margin-top:.2rem; }
.subnav { display:flex; gap:.25rem; overflow-x:auto; margin:0 0 1rem; scrollbar-width:none; border-bottom:1px solid var(--line); }
.subnav::-webkit-scrollbar { display:none; }
.subnav button { font:500 .88rem "IBM Plex Sans", sans-serif; background:none; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:.5rem .6rem; cursor:pointer; white-space:nowrap; margin-bottom:-1px; }
.subnav button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--primary); }
.controls { display:flex; flex-wrap:wrap; gap:.5rem; margin:0 0 1rem; }
details.explain { background:var(--panel); border-radius:8px; margin:0 0 1.1rem; font-size:.88rem; }
details.explain summary { cursor:pointer; padding:.6rem .8rem; font-weight:600; color:var(--text); list-style:none; display:flex; align-items:center; gap:.45rem; }
details.explain summary::-webkit-details-marker { display:none; }
details.explain summary::before { content:"?"; display:inline-grid; place-items:center; width:1.15rem; height:1.15rem; border-radius:50%; background:var(--chip); color:var(--chip-text); font-size:.72rem; flex:none; }
details.explain[open] summary { padding-bottom:.2rem; }
details.explain > div { padding:.2rem .8rem .75rem; color:var(--muted); }
details.explain ol, details.explain ul { margin:.3rem 0 0; padding-left:1.2rem; }
details.explain li { margin:.2rem 0; }
.verdict { border-left:3px solid var(--primary); padding:.15rem 0 .15rem .8rem; margin:0 0 1.1rem; font-size:.95rem; }
.verdict.good { border-color:var(--pos); } .verdict.bad { border-color:var(--neg); }
.verdict strong { color:var(--text); }
.steps3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:.5rem; margin:0 0 1.1rem; counter-reset:st; }
.steps3 div { background:var(--panel); border-radius:8px; padding:.55rem .6rem; font-size:.8rem; color:var(--muted); counter-increment:st; }
.steps3 div::before { content:counter(st); display:block; font-weight:600; color:var(--primary); font-size:.95rem; }
.steps3 b { color:var(--text); font-weight:600; }
.chart { position:relative; margin:.2rem 0 1.2rem; }
.chart svg { display:block; width:100%; height:auto; touch-action:pan-y; }
.chart svg:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
.chart .grid line { stroke:var(--line); }
.chart .zero { stroke:var(--faint); }
.chart text { fill:var(--faint); font:12px "IBM Plex Sans", sans-serif; font-variant-numeric:tabular-nums; }
.chart .lbl { fill:var(--text); font-weight:600; }
.chart .xh { stroke:var(--faint); stroke-dasharray:2 3; visibility:hidden; }
.chart .tip { position:absolute; top:0; pointer-events:none; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.35rem .5rem; font-size:.78rem; box-shadow:0 2px 8px rgba(0,0,0,.12); visibility:hidden; min-width:9rem; }
.chart .tip .h { color:var(--faint); margin-bottom:.15rem; }
.chart .tip .r { display:flex; align-items:center; gap:.4rem; }
.chart .tip .r i { display:inline-block; width:.8rem; height:2px; }
.chart .tip .r b { font-variant-numeric:tabular-nums; }
.chart .tip .r span { color:var(--muted); }
.ckey { display:flex; gap:1rem; flex-wrap:wrap; font-size:.8rem; color:var(--muted); margin:.2rem 0 .3rem; }
.ckey i { display:inline-block; width:.9rem; height:2px; vertical-align:middle; margin-right:.35rem; }
.ckey i.dash { background:none !important; border-top:2px dashed; height:0; }
details.more-list summary { cursor:pointer; color:var(--primary); font-size:.9rem; padding:.4rem 0; }
.mine-badge { display:inline-block; font-size:.68rem; font-weight:600; background:var(--chip); color:var(--chip-text); border-radius:999px; padding:.05rem .45rem; margin-left:.35rem; vertical-align:1px; white-space:nowrap; }
.betform { display:grid; gap:.6rem; }
.betform label { display:grid; gap:.2rem; font-size:.8rem; color:var(--faint); min-width:0; }
.betform input, .betform select { font: 400 1rem "IBM Plex Sans", sans-serif; color:var(--text); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:.5rem .55rem; width:100%; min-width:0; }

    const at = (zone) => new Date(new Date(guess).toLocaleString("en-US", { timeZone: zone })).getTime();
    return new Date(guess - (at("Europe/London") - at("UTC")));

}

const sgn = (x, d = 1) => (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d);

// Line chart: series = [{name, color, dash, points: [[label, x, y], ...]}], y in betting units.
const CHARTS = {};

function lineChart(series, opt = {}) {

  const W = 360, H = 210, L = 44, R = 64, T = 10, B = 26;

  const grid = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="${v === 0 ? "zero" : ""}"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${v === 0 ? "0" : opt.plain ? v.toFixed(step < 1 ? 1 : 0) : sgn(v, step < 1 ? 1 : 0)}</text>`).join("");

  const xl = `<text x="${L}" y="${H - 6}">${esc(xfmt(first[0]))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(xfmt(last[0]))}</text>`;
  // direct labels at the line ends, nudged apart
  const ends = series.map((s) => ({ s, y: Y(s.points[s.points.length - 1][2]) })).sort((a, b) => a.y - b.y);

  const labels = ends.map((e) => `<text class="lbl" x="${W - R + 6}" y="${e.y + 4}">${esc(fmt(e.s.points[e.s.points.length - 1][2]))}</text>`).join("");

      const h = document.createElement("div"); h.className = "h"; h.textContent = `${parseLocal(base[cur][0]).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })} · bet ${xv}`; tip.appendChild(h);
      c.series.forEach((s) => {
        let p = s.points[0]; for (const q of s.points) { if (q[1] <= xv) p = q; else break; }
        const r = document.createElement("div"); r.className = "r";
        const k = document.createElement("i"); k.style.background = s.color;
        const v = document.createElement("b"); v.textContent = c.fmt(p[2]);
        const n = document.createElement("span"); n.textContent = s.name;
        r.append(k, v, n); tip.appendChild(r);
      });
      const box = el.getBoundingClientRect(), scale = box.width / c.W;
      tip.style.visibility = "visible";
      const left = px * scale + 12, w = tip.offsetWidth;
      tip.style.left = Math.max(0, Math.min(box.width - w, left + w > box.width ? px * scale - w - 12 : left)) + "px";
    }
    function hide() { xh.style.visibility = "hidden"; tip.style.visibility = "hidden"; }
    function nearest(ev) {
      const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
      const v = pt.matrixTransform(svg.getScreenCTM().inverse());
      let best = 0, bd = 1e9; base.forEach((p, i) => { const d = Math.abs(c.X(p[1]) - v.x); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    svg.addEventListener("pointermove", (ev) => show(nearest(ev)));
    svg.addEventListener("pointerdown", (ev) => show(nearest(ev)));
    svg.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => show(cur));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") { show(cur + 1); ev.preventDefault(); }
      if (ev.key === "ArrowLeft") { show(cur - 1); ev.preventDefault(); }
    });
  });
}

function recValue() {
  const v = DATA.value, bt = DATA.backtest;
  const steps = "";
  const how = explain("How value bets are found and judged", `<p><strong>Fair price</strong> from the Betfair Exchange and Pinnacle, margin removed. <strong>Value</strong> when a UK bookmaker pays ${(DATA.value_threshold * 100).toFixed(0)}%+ more, logged before kick-off. <strong>Checked</strong> against the result and the exchange's closing price.</p><p>Football is noisy: a good bet loses often and a bad one wins often, so profit over a few dozen bets is mostly luck. The <strong>closing price</strong> (the exchange's odds at kick-off) is the market's best estimate once all news is in. If our bets keep getting better odds than that, we are taking prices that are too generous, and that edge turns into profit over hundreds of bets.</p>
    <p><strong>Beat the closing price by +3%</strong> means: on average, the odds we took were 3% higher than fair odds at kick-off. The dashed line in the chart is the profit that edge should have produced; the solid line is what actually happened.</p>`);
  if (!v || !v.logged) return steps + `<p class="empty">No value bets logged yet.</p>`;

      : `<strong>Too early to call.</strong> ${v.settled} value bets settled; they beat the closing price by ${pcs(v.clv)} on average${v.clv_lo != null ? ` (${rangeText(v.clv, (v.clv_hi - v.clv_lo) / 2)})` : ""}. The range still includes zero.`}</p>`;
  const tiles = `<dl class="stats">
      <div><dt>Settled bets</dt><dd>${v.settled} <small>${v.wins} won, ${v.logged - v.settled} pending</small></dd></div>

  const chart = v.curve ? `<h3 class="day">Profit, bet by bet</h3>${lineChart([
      { name: "Actual profit", color: "var(--s1)", points: v.curve.map((p) => [p[0], p[1], p[2]]) },
      { name: "Expected from beating the close", color: "var(--s2)", dash: true, points: v.curve.map((p) => [p[0], p[1], p[3]]) }],

  const bookRows = (v.by_book || []).map((r) => `<tr><td>${esc(r.book)}</td><td>${r.bets}</td><td>${r.wins}</td><td class="${r.profit >= 0 ? "better" : "worse"}">${units(r.profit)}</td><td>${pcs(r.clv)}</td></tr>`).join("");
  const outRows = (v.by_outcome || []).map((r) => `<tr><td>${OUT[r.outcome]}</td><td>${r.bets}</td><td>${r.wins}</td><td class="${r.profit >= 0 ? "better" : "worse"}">${units(r.profit)}</td><td>${pcs(r.clv)}</td></tr>`).join("");

  return `${steps}${verdict}${tiles}${how}${chart}
    ${bookRows ? `<h3 class="day">By bookmaker</h3><div class="cs-scroll"><table class="cmp">${head("Bookmaker")}<tbody>${bookRows}</tbody></table></div>

    ${v.flagged ? `<p class="note"><strong>${v.flagged} earlier bet${v.flagged === 1 ? " is" : "s are"} not counted.</strong>${v.flagged_error ? ` ${v.flagged_error} showed an "edge" above ${(DATA.max_ev * 100).toFixed(0)}% because an empty Betfair Exchange market was read as the fair price: a fault in EdgeLab, since fixed.` : ""}${v.flagged_friday ? ` ${v.flagged_friday} used a bookmaker price from Football-Data's weekly file (collected on Friday) set against a fair price checked later. That price may no longer have been on offer, and it flatters the record because the market has usually moved since. Value is now flagged only from prices checked at the same moment.` : ""}${v.flagged_record ? ` Had they been counted: ${v.flagged_record.bets} settled, ${v.flagged_record.wins} won, ${units(v.flagged_record.profit)}, ${pcs(v.flagged_record.clv)} against the closing price.` : ""} They are still shown, greyed, in the list below.</p>` : ""}

    <details class="more-list"><summary>All ${v.logged + (v.flagged || 0)} logged bets</summary><div class="vlist">${v.bets.map((b) => `<div class="vrow${b.flagged ? " off" : ""}"><span>${esc(b.outcome === "draw" ? "Draw" : (b.outcome === "home" ? b.home : b.away) + " to win")} <span class="diff">(${esc(b.home)} v ${esc(b.away)})</span>${b.mine ? `<span class="mine-badge">Yours</span>` : ""}</span>
      <span class="ev ${!b.flagged && b.settled ? (b.won ? "ok" : "miss") : ""}" style="${!b.flagged && b.settled ? "" : "color:var(--faint)"}">${b.flagged ? "Not counted" : b.settled ? (b.won ? "Won" : "Lost") : "Pending"}</span>

}

function recModel() {
  const r = DATA.record, live = DATA.live, list = r.model_windows || [];

  if (avg && avg.diff != null) {

    verdict = avg.diff > 0
      ? `<strong>The bookmakers have been more accurate${sure ? "" : ", but only slightly"}.</strong> On these ${avg.n} matches their margin-free chances scored ${avg.logloss.toFixed(3)} against the model's ${avg.model_same.toFixed(3)} (lower is better). ${sure ? "The gap is bigger than luck would explain." : "The gap is small enough to be luck."}`
      : `<strong>The model has been ${sure ? "more accurate" : "level with the bookmakers"}.</strong> It scored ${avg.model_same.toFixed(3)} against the bookmakers' ${avg.logloss.toFixed(3)} on ${avg.n} matches (lower is better). ${sure ? "That is more than luck would explain." : "The gap is small enough to be luck."}`;
    verdict += ` The model's favourite won ${pc(avg.model_fav)} of the time, the bookmakers' ${pc(avg.fav)}.`;
  }
  const rows = w.rows.map((x) => `<tr class="${x.model ? "mine" : ""}"><td>${esc(x.label)}<small>${x.n} matches</small></td><td>${x.logloss.toFixed(3)}</td>
      <td>${x.model ? "–" : x.model_same.toFixed(3)}</td><td>${x.model ? "–" : `<span class="${x.diff_ci != null && Math.abs(x.diff) > x.diff_ci ? (x.diff > 0 ? "worse" : "better") : "same"}">${sgn(x.diff, 3)}</span>${x.diff_ci != null ? `<small>±${x.diff_ci.toFixed(3)}</small>` : ""}`}</td><td>${pc(x.fav)}</td></tr>`).join("");
  return `<p class="lede" style="margin-top:-.25rem">Who forecasts results better: our model, or the bookmakers' prices once their margin is removed? Every match was predicted using only results from before it.</p>

    <div class="cs-scroll"><table class="cmp"><thead><tr><th>Source</th><th>Accuracy</th><th>Model, same matches</th><th>vs model</th><th>Favourite won</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="diff cs-note">Bookmaker chances use Football-Data's prices from the Friday (or Tuesday) before each round. Opta's figures appear for the rounds typed in from Opta Analyst's preview.</p>

const VERDICT = { edge: ["Real edge", "better"], promising: ["Promising", "same"], none: ["No edge", "same"], loses: ["Loses", "worse"], few: ["Too few bets", "same"], lucky: ["Ahead by luck", "same"] };
function recLab() {
  const lab = DATA.record.lab;
  if (!lab || !lab.rows || !lab.rows.length) return `<p class="empty">The strategy tests appear after the next update.</p>`;
  const nt = lab.notes || {}, groups = [...new Set(lab.rows.map((r) => r.group))];
  const edges = lab.rows.filter((r) => r.verdict === "edge"), losers = lab.rows.filter((r) => r.verdict === "loses");
  const row = (r) => {
    const [txt, cls] = VERDICT[r.verdict] || VERDICT.none;
    const sea = (r.seasons || []).map((x) => `${x.label.slice(2)} ${pcs(x.roi, 0)}`).join(" · ");
    return `<tr><td style="white-space:normal">${esc(r.name)}<small>${esc(r.how)}</small>${sea ? `<small>By season: ${esc(sea)}</small>` : ""}</td>
      <td>${r.n}</td><td>${r.roi != null ? `${pcs(r.roi)}${r.roi_ci != null ? `<small>±${(r.roi_ci * 100).toFixed(0)}%</small>` : ""}` : "–"}</td>
      <td>${r.clv != null ? `${pcs(r.clv)}${r.clv_ci != null ? `<small>±${(r.clv_ci * 100).toFixed(1)}%</small>` : ""}` : "–"}</td>
      <td><span class="${cls}" style="font-weight:600">${txt}</span></td></tr>`;
  };
  return `<p class="lede" style="margin-top:-.25rem">Every betting idea we have tried, re-run each round on ${nt.matches || ""} matches since ${esc(nt.from || "2024/25")}. 1 unit a bet at real pre-match prices.</p>
    <p class="verdict ${edges.length ? "good" : ""}">${edges.length ? `<strong>${edges.length === 1 ? "One strategy shows" : edges.length + " strategies show"} a real edge:</strong> ${edges.map((r) => esc(r.name.toLowerCase())).join("; ")}.` : "<strong>No strategy shows a proven edge yet.</strong>"}
      ${losers.length ? ` ${losers.length} clearly lose money.` : ""} Anything built on the model's own opinion has no edge; what works is taking prices above the sharp fair price.</p>
    ${explain("How to read the verdicts", `<ul>
      <li><strong>Return</strong> is profit per unit staked. Over a few hundred bets it swings a lot, so the ± range is wide.</li>
      <li><strong>Beat close</strong> is how far the odds taken were above the closing fair odds. It needs far fewer bets to trust, so the verdict leans on it.</li>
      <li><strong>Real edge</strong>: beat the close by more than its ± range, on 80+ bets. <strong>Promising</strong>: beat the close, but not yet beyond doubt. <strong>No edge</strong>: indistinguishable from the bookmaker's margin. <strong>Loses</strong>: below zero even at the top of its range.</li>
      <li>With this many ideas tested, one or two will look good by luck. Trust a strategy only when it holds in each season and has a reason behind it.</li></ul>`)}
    ${groups.map((g) => `<h3 class="day">${esc(g)}</h3><div class="cs-scroll"><table class="cmp"><thead><tr><th>Strategy</th><th>Bets</th><th>Return</th><th>Beat close</th><th>Verdict</th></tr></thead><tbody>${lab.rows.filter((r) => r.group === g).map(row).join("")}</tbody></table></div>`).join("")}
    <h3 class="day">Other checks</h3>
    <ul class="diff" style="padding-left:1.1rem">
      ${nt.arb_share != null ? `<li><strong>Arbitrage</strong> (best prices across bookmakers adding up to a sure profit) appeared in ${pc(nt.arb_share, 1)} of matches${nt.arb_profit != null ? `, locking in ${pc(nt.arb_profit, 1)} on average` : ""}: too rare and too thin to rely on.</li>` : ""}
      ${nt.blend_w != null ? `<li><strong>Blending the model with the sharp price</strong>: the most accurate mix over ${nt.blend_n} matches puts ${nt.blend_w <= 0 ? "no weight" : pc(nt.blend_w) + " weight"} on the model (accuracy score ${nt.ll_sharp.toFixed(3)} for the sharp price alone, ${nt.ll_model.toFixed(3)} for the model alone).${nt.blend_w <= 0 ? " The model adds nothing the market does not already know." : ""}</li>` : ""}
    </ul>
    <p class="diff cs-note">Prices are Football-Data's, collected on the Friday or Tuesday before each round; "best price" is the highest among the bookmakers it tracks. The sharp fair price is the average of Pinnacle and the Betfair Exchange with the margin removed. </p>`;
}

function recGoals() {
  const g = DATA.record.goals;
  if (!g || !g.n) return `<p class="empty">No matches played yet this season.</p>`;
  const st = g.ou_strategies || [], acc = g.ou_accuracy || [], bt = g.btts_accuracy, live = (DATA.value || {}).lines;
  const me = acc.find((x) => x.model), ex = acc.find((x) => x.label === "Betfair Exchange") || acc.find((x) => !x.model);
  const val = st.find((x) => x.name.startsWith("Value at Bet365")), pick = st.find((x) => x.name === "Model's pick at Bet365");
  const srow = (r) => { const [txt, cls] = VERDICT[r.verdict] || VERDICT.none;

      <li><strong>Favourites pay short odds.</strong> At average odds of ${m.odds != null ? m.odds.toFixed(2) : "2.00"} you need to win ${m.odds != null ? pc(1 / m.odds) : "50%"} of bets just to break even, and the bookmaker's margin (about 5%) is built into every price.</li>

function spark(series) {
  if (!series || series.length < 2) return "";
  const W = 300, H = 64, pad = 4;
  const ts = series.map((r) => parseLocal(r[0]).getTime());
  const t0 = ts[0], t1 = ts[ts.length - 1] || t0 + 1;
  const vals = series.flatMap((r) => r.slice(1));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 0.1) { const m = (hi + lo) / 2; lo = m - 0.05; hi = m + 0.05; }
  const x = (t) => pad + ((t - t0) / Math.max(1, t1 - t0)) * (W - 2 * pad);
  const y = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - 2 * pad);
  const line = (k, col) => `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${series.map((r, i) => `${x(ts[i]).toFixed(1)},${y(r[k + 1]).toFixed(1)}`).join(" ")}"/>`;
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${line(1, "var(--draw)")}${line(2, "var(--away)")}${line(0, "var(--home)")}</svg>`;
}
function moveCell(m, k, label) {
  const d = (m.now[k] - m.open[k]) * 100;

}

}
function lagTable(rows) {
  const pct = (x) => (x == null ? "–" : pc(Math.max(0, Math.min(1, x))));
  const cu = (r) => r.catchup_h == null ? (r.never_inf ? "rarely" : "–") : r.catchup_h <= 0.1 ? "at once" : r.catchup_h < 1 ? `${Math.round(r.catchup_h * 60)} min` : `${r.catchup_h.toFixed(1)} h`;
  return `<div class="cs-scroll"><table class="cmp"><thead><tr><th>Bookmaker</th><th>Moves</th><th>Copied</th><th>Half-way</th><th>Value after</th></tr></thead><tbody>

    <p>Fair odds are the decimal odds at which a bet would break even if the model were exactly right: 1 divided by the probability. The thin black marks under each bar show how the bookmakers split the same match, once their margin is removed.</p>
    <h3>How good is it?</h3>
    <p>Tested on 810 past matches it had never seen (August 2024 to September 2026), the model was slightly less accurate than every bookmaker we compared: Bet365, the Betfair Exchange, Pinnacle and the market average were all within a whisker of each other and a little ahead of the model. On its own, the model does not find value: bets it rated as value got no better prices than picking at random. The <a href="#record/model">Track record</a> tab keeps this comparison up to date, and <a href="#record/fav">Betting the favourites</a> tests whether backing the model's picks makes money.</p>
    <h3>Finding value</h3>
    <p>Value bets on this site come from comparing prices, not from the model. The Betfair Exchange (and Pinnacle, when available) prices each match with almost no margin, so its odds are the fairest estimate of the true chances. Now and then an ordinary bookmaker offers better odds than that fair price. Only UK-licensed sportsbooks are compared; Bet365 and Betfair Sportsbook are marked as "your bookmaker". When one beats it by ${(DATA.value_threshold * 100).toFixed(0)}% or more, it is listed as a value bet.</p>
    <p>Tested on the same 810 matches, this rule found 120 bets. On average they got prices 4.8% better than the exchange's closing price (range 3.1% to 6.5%), and they did so in every season tested. Profit was +18.7% but over so few bets that luck dominates (range −10% to +49%). Prices move quickly, the best price is not always with a bookmaker you can use, and bookmakers limit accounts that win, so treat this as a strong lead, not a guarantee. Every value bet is logged before kick-off and settled on the <a href="#record/value">Track record</a> tab, so the rule can be checked in the open.</p>
    ${DATA.odds_api_credits != null ? `<p class="diff">Live odds feed: ${esc(DATA.odds_api_credits)} free API credits left this month. A full snapshot of every bookmaker uses 2; a quick one of ten key bookmakers uses 1. See Market moves for the schedule.</p>` : ""}
    <h3>Words used on this site</h3>
    <dl class="gloss">
      <dt>Decimal odds</dt><dd>What a 1-unit winning bet returns, stake included: 2.50 returns 2.50 (1.50 profit).</dd>
      <dt>Chance</dt><dd>1 divided by the odds. Odds of 2.50 imply a 40% chance.</dd>
      <dt>Margin</dt><dd>A bookmaker's built-in edge: its chances for home, draw and away add up to more than 100%, typically 104% to 107%.</dd>
      <dt>Fair odds</dt><dd>Odds with the margin removed, so the chances add up to exactly 100%. Bookmakers put more of their margin on long shots, so for Pinnacle we remove it with Shin's method, which takes more off long shots than favourites. Tested on three seasons: sharing the margin out evenly made long shots look up to 17% likelier than the exchange thought, and flagged bets that did not beat the closing price.</dd>
      <dt>Sharp price</dt><dd>The Betfair Exchange and Pinnacle: big, low-margin markets that react fastest to news. We use them as the fair price.</dd>
      <dt>Value bet</dt><dd>A bookmaker's odds at least ${(DATA.value_threshold * 100).toFixed(0)}% above the sharp fair odds.</dd>
      <dt>Closing price</dt><dd>The exchange's odds at kick-off, when all team news is known: the market's final verdict.</dd>
      <dt>Beat the close (CLV)</dt><dd>How much better your odds were than the closing fair odds. Consistently positive means a real edge, whatever the results.</dd>
      <dt>Accuracy score</dt><dd>Log loss: how little chance a forecast gave to what happened. Lower is better.</dd>
      <dt>Quarter-Kelly</dt><dd>A cautious stake size: a quarter of the Kelly (1956) formula, value divided by (odds minus 1).</dd>
      <dt>Unit</dt><dd>One standard stake. Profit in units is profit if every bet were the same size.</dd>
    </dl>

    <p>If you bet, only bet what you can afford to lose. You must be 18 or over. Free, confidential help is available from <a href="https://www.begambleaware.org" rel="noopener">BeGambleAware</a>.</p></div>`;
}

// Long explanations fold away behind an info button; the headline stays.
function tidy() {
  const btn = (label, inline) => { const b = document.createElement("button"); b.type = "button"; b.className = "ibtn" + (inline ? " inline" : ""); b.setAttribute("aria-expanded", "false"); b.innerHTML = II + (inline ? "" : `<span>${label}</span>`); if (inline) b.setAttribute("aria-label", label); return b; };
  document.querySelectorAll("#main p.cs-note").forEach((p) => {
    if (p.dataset.t) return; p.dataset.t = "1"; p.hidden = true;
    const b = btn("How to read this");
    b.onclick = () => { p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); };
    p.before(b);
  });
  document.querySelectorAll("#main p.note, #main p.lede").forEach((p) => {
    if (p.dataset.t) return; p.dataset.t = "1";
    const h = p.innerHTML, st = h.indexOf("</strong>"), from = p.classList.contains("note") && st > 0 ? st + 9 : 0, cut = h.indexOf(". ", from);
    const end = from && (cut < 0 || cut - from > 4) ? from : cut < 0 ? -1 : cut + 1;   // a note keeps its bold headline; a lede its first sentence
    if (end <= 0 || h.length - end < 70 || h.slice(0, end).lastIndexOf("<a ") > h.slice(0, end).lastIndexOf("</a>")) return;
    p.innerHTML = h.slice(0, end) + `<span class="rest" hidden> ${h.slice(end)}</span>`;
    const b = btn("More detail", true), r = p.querySelector(".rest");
    b.onclick = () => { r.hidden = !r.hidden; b.setAttribute("aria-expanded", String(!r.hidden)); };
    p.insertBefore(b, r);
  });
}
